[project]
name = "bridge"
version = "0.1.0"
description = "An agentic crisis navigator that quietly connects people who need help to people who want to give it."
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

# Bridge's four LLM roles live in core/reason.jac. With no API key set the app
# falls back to deterministic heuristics and still runs end to end -- export
# OPENAI_API_KEY (or ANTHROPIC_API_KEY / GOOGLE_API_KEY) to switch the real
# model on. Override the model for one shell with BYLLM_DEFAULT_MODEL=...
[byllm.model]
default_model = "gpt-4o-mini"

[byllm.call_params]
temperature = 0.2

